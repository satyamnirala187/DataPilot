# Render Blueprint for the DataPilot API: one Python web service, one process.
# Secrets are never stored here: Render asks for every "sync: false" value in its dashboard.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: datapilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker, so the in-memory rate limiter sees every request. Client addresses come from
    # app/client_ip.py (CF-Connecting-IP, set by Cloudflare), so uvicorn's X-Forwarded-For
    # handling is switched off: the app never relies on a header the client can forge.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION  # not a secret; takes precedence over other version settings on Render
        value: "3.13.16"
      - key: TRUST_CF_CONNECTING_IP  # not a secret; Render's edge is Cloudflare, which sets this header
        value: "true"
      - key: READONLY_DATABASE_URL  # the read-only role via the Supabase session pooler
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # JSON list: the Vercel URL plus localhost origins
        sync: false
      # Private demo access (docs/deployment.md, "Private demo access"). Without all three the
      # backend fails closed: login is unavailable and every /query is refused.
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD  # at least 16 characters
        sync: false
      - key: DEMO_SESSION_SECRET  # at least 32 characters; signs session tokens, never shared
        sync: false
